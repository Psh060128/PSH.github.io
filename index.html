<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Animal Sort · 动物分类小游戏</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(circle at 18% 8%, #fff8ec 0%, #ffe8d1 45%, #d8f0e4 100%);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  #game {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 10px 12px 12px;
    gap: 8px;
  }

  /* ---------- 顶栏 ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .title {
    font-size: clamp(15px, 2.4vw, 24px); font-weight: 900; color: #6b4b2a;
    letter-spacing: .5px; text-shadow: 0 2px 0 #fff, 0 0 10px rgba(255,255,255,.8);
  }
  .progress {
    margin-left: auto; background: #fff; border-radius: 999px; padding: 5px 16px;
    font-weight: 900; color: #4f8f5a; box-shadow: 0 3px 0 #e2d8c9;
    font-size: clamp(12px, 1.7vw, 17px);
  }
  #reset {
    border: none; background: #ffb347; color: #fff; font-weight: 900;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 0 #e08e28; font-size: clamp(12px, 1.5vw, 15px);
    font-family: inherit; transition: transform .08s;
  }
  #reset:active { transform: translateY(3px); box-shadow: 0 1px 0 #e08e28; }

  /* ---------- 分类区 ---------- */
  .board { flex: 1 1 auto; display: flex; gap: 12px; min-height: 0; }

  .bin {
    position: relative; flex: 1; border-radius: 26px; overflow: hidden;
    border: 4px solid #fff;
    box-shadow: 0 10px 24px rgba(120, 90, 60, .16), inset 0 0 0 3px rgba(255,255,255,.55);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .bin[data-type="farm"] { background: #dcf5d3; }
  .bin[data-type="wild"] { background: #dde9d5; }
  .bin.hot {
    transform: scale(1.02);
    box-shadow: 0 0 0 7px rgba(255,255,255,.95), 0 14px 28px rgba(120,90,60,.28);
  }
  .bin.wrong { animation: binShake .4s ease; }
  @keyframes binShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px) rotate(-1deg); }
    75% { transform: translateX(7px) rotate(1deg); }
  }

  .bin-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .bin-content {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; padding: 10px 12px;
  }
  .bin-title {
    align-self: center;
    background: rgba(255,255,255,.94);
    color: #5a4a3a; font-weight: 900;
    font-size: clamp(12px, 1.9vw, 19px);
    padding: 4px 18px; border-radius: 999px;
    box-shadow: 0 3px 0 rgba(0,0,0,.09);
    letter-spacing: .6px; white-space: nowrap;
  }
  .slots {
    flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start;
    justify-content: center; gap: 6px; padding-top: 10px; overflow: hidden;
  }
  .chip {
    width: clamp(42px, 8.5vw, 60px);
    display: flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,.88);
    border-radius: 14px; padding: 3px;
    box-shadow: 0 3px 0 rgba(0,0,0,.08);
    transform: scale(.3); opacity: 0;
    transition: transform .3s cubic-bezier(.34,1.6,.64,1), opacity .3s;
  }
  .chip.pop { transform: scale(1); opacity: 1; }
  .chip svg { width: 100%; height: auto; display: block; }
  .chip span {
    font-size: clamp(8px, 1.1vw, 11px); font-weight: 900;
    color: #6b5a45; line-height: 1.25;
  }

  /* ---------- 动物托盘 ---------- */
  .tray-space { flex: 0 0 34%; min-height: 130px; }

  .stage {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 50;
  }

  .animal {
    position: absolute;
    width: 96px;
    cursor: grab; pointer-events: auto;
    transition: left .32s cubic-bezier(.34,1.4,.64,1), top .32s cubic-bezier(.34,1.4,.64,1);
    will-change: left, top;
  }
  .animal .inner {
    display: block; width: 100%;
    transform-origin: 50% 88%;
    filter: drop-shadow(0 4px 5px rgba(120,90,60,.20));
    transition: transform .18s ease;
  }
  .animal svg { width: 100%; height: auto; display: block; }
  .animal .label {
    text-align: center; font-weight: 900; font-size: 14px; color: #6b5a45;
    margin-top: -2px;
    text-shadow: 0 1px 0 #fff, 0 0 7px #fff, 0 0 3px #fff;
  }
  .animal:hover:not(.dragging) .inner { transform: translateY(-4px) rotate(-2deg); }

  .animal.dragging { z-index: 999; transition: none; cursor: grabbing; }
  .animal.dragging .inner {
    animation: wobble .42s ease-in-out infinite;
    filter: drop-shadow(0 14px 14px rgba(90,70,50,.30));
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-9deg); }
    50%      { transform: rotate(9deg); }
  }

  .animal.wrong .inner { animation: shakeX .42s ease; }
  @keyframes shakeX {
    0%,100% { transform: translateX(0) rotate(0); }
    25%     { transform: translateX(-9px) rotate(-7deg); }
    75%     { transform: translateX(9px) rotate(7deg); }
  }

  /* ---------- 屏幕氛围灯 ---------- */
  #glow {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 150;
    opacity: 0;
  }
  #glow.green {
    box-shadow:
      inset 0 0 0 7px  rgba(140, 255, 170, .98),
      inset 0 0 55px 16px rgba(70, 235, 115, .80),
      inset 0 0 170px 70px rgba(40, 210, 90, .40);
  }
  #glow.red {
    box-shadow:
      inset 0 0 0 7px  rgba(255, 150, 150, .98),
      inset 0 0 55px 16px rgba(255, 85, 85, .80),
      inset 0 0 170px 70px rgba(255, 45, 45, .42);
  }
  #glow.flash { animation: glowPulse .78s ease-out forwards; }
  @keyframes glowPulse {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    36%  { opacity: .45; }
    58%  { opacity: .95; }
    100% { opacity: 0; }
  }

  /* ---------- 通关弹窗 ---------- */
  .win {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: rgba(90, 70, 50, .35);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .win.show { opacity: 1; pointer-events: auto; }
  .win-card {
    background: #fffdf8; border-radius: 28px; padding: 34px 46px;
    text-align: center; box-shadow: 0 20px 50px rgba(90,70,50,.3);
    transform: scale(.7); transition: transform .4s cubic-bezier(.34,1.6,.64,1);
    border: 5px solid #ffe0a8;
  }
  .win.show .win-card { transform: scale(1); }
  .win-card h2 { margin: 0 0 6px; font-size: 28px; color: #6b4b2a; }
  .win-card p { margin: 0 0 18px; color: #9b8a76; font-weight: 700; }
  .win-card button {
    border: none; background: #7fce8b; color: #fff; font-weight: 900;
    padding: 12px 32px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 5px 0 #5bab68; font-size: 17px; font-family: inherit;
  }
  .win-card button:active { transform: translateY(4px); box-shadow: 0 1px 0 #5bab68; }

  @media (max-width: 680px) {
    .animal { width: 72px; }
    .animal .label { font-size: 11px; }
    .tray-space { flex-basis: 36%; }
  }
</style>
</head>

/* =========================================================
   2. 英语发音（Web Speech API）
   ========================================================= */
let enVoice = null;

function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  // 优先挑一个美式英语的自然女声
  const prefer = [/samantha/i, /zira/i, /google us english/i, /aria/i, /jenny/i, /female/i];
  enVoice =
    voices.find(v => /^en[-_]US/i.test(v.lang) && prefer.some(p => p.test(v.name))) ||
    voices.find(v => /^en[-_]US/i.test(v.lang)) ||
    voices.find(v => /^en[-_]GB/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang)) ||
    null;
}

if ('speechSynthesis' in window) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

/* 朗读动物英文名 */
function speakName(name) {
  if (!('speechSynthesis' in window)) return;
  const synth = window.speechSynthesis;
  synth.cancel();                       // 打断上一个，避免排队

  const u = new SpeechSynthesisUtterance(name);
  u.lang  = 'en-US';
  u.rate  = 0.82;                       // 放慢，方便学生听清
  u.pitch = 1.08;
  u.volume = 1;
  if (!enVoice) pickVoice();
  if (enVoice) u.voice = enVoice;

  synth.speak(u);
}

/* =========================================================
   3. 判定提示音（Web Audio，对 / 错）
   ========================================================= */
let audioCtx = null;

function ac() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playDing(good) {
  const ctx = ac();
  if (!ctx) return;
  const t = ctx.currentTime + 0.01;
  const notes = good ? [659.25, 880, 1174.66] : [330, 233];
  notes.forEach((f, i) => {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = ctx.createGain();
    const st = t + i * (good ? 0.075 : 0.13);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.linearRampToValueAtTime(good ? 0.12 : 0.11, st + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, st + (good ? 0.34 : 0.24));
    o.connect(g); g.connect(ctx.destination);
    o.start(st); o.stop(st + 0.45);
  });
}

/* =========================================================
   4. 屏幕氛围灯
   ========================================================= */
const glowEl = document.getElementById('glow');
let glowTimer = null;

function flashScreen(color) {
  glowEl.className = '';
  void glowEl.offsetWidth;          // 强制重排，重启动画
  glowEl.classList.add(color, 'flash');
  clearTimeout(glowTimer);
  glowTimer = setTimeout(() => { glowEl.className = ''; }, 820);
}

/* =========================================================
   5. 游戏逻辑
   ========================================================= */
const game    = document.getElementById('game');
const board   = document.getElementById('board');
const stage   = document.getElementById('stage');
const doneEl  = document.getElementById('done');
const totalEl = document.getElementById('total');
const winEl   = document.getElementById('win');

let placed = 0;
let drag = null;

totalEl.textContent = ANIMALS.length;

/* ---- 创建动物 ---- */
function buildGame() {
  stage.innerHTML = '';
  document.querySelectorAll('.slots').forEach(s => s.innerHTML = '');
  winEl.classList.remove('show');
  glowEl.className = '';
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();

  placed = 0;
  doneEl.textContent = '0';
  drag = null;

  const list = [...ANIMALS].sort(() => Math.random() - 0.5);

  list.forEach(a => {
    const el = document.createElement('div');
    el.className = 'animal';
    el.dataset.type = a.type;
    el.dataset.id = a.id;
    el.innerHTML = `<div class="inner">${a.svg}</div><div class="label">${a.name}</div>`;
    el._animal = a;
    el.addEventListener('pointerdown', onPointerDown);
    stage.appendChild(el);
  });

  layout();
}

/* ---- 布局：把动物排在下方托盘区 ---- */
function layout() {
  const animals = [...stage.querySelectorAll('.animal:not(.placed)')];
  if (!animals.length) return;

  const gr = game.getBoundingClientRect();
  const br = board.getBoundingClientRect();
  const trayTop  = br.bottom - gr.top + 8;
  const trayH    = Math.max(90, gr.height - trayTop - 8);
  const trayW    = gr.width - 20;
  const trayLeft = 10;

  const n    = animals.length;
  const cols = Math.min(n, 4);
  const rows = Math.ceil(n / cols);
  const cellW = trayW / cols;
  const cellH = trayH / rows;

  const cw = animals[0].offsetWidth  || 96;
  const ch = animals[0].offsetHeight || 118;

  animals.forEach((el, i) => {
    const r = Math.floor(i / cols);
    const c = i % cols;
    const inRow   = (r === rows - 1) ? (n - r * cols) : cols;
    const rowW    = inRow * cellW;
    const rowLeft = trayLeft + (trayW - rowW) / 2;

    const x = rowLeft + c * cellW + (cellW - cw) / 2;
    const y = trayTop  + r * cellH + (cellH - ch) / 2;

    el._home = { x, y };
    if (!el.classList.contains('dragging')) {
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    }
  });
}

/* ---- 命中检测 ---- */
function hitBin(cx, cy) {
  let found = null;
  document.querySelectorAll('.bin').forEach(b => {
    const r = b.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) found = b;
  });
  return found;
}

/* ---- 按下：朗读英文名 + 开始拖拽 ---- */
function onPointerDown(e) {
  const el = e.currentTarget;
  if (el.classList.contains('placed')) return;
  e.preventDefault();

  ac(); // 解锁音频上下文

  const gr = game.getBoundingClientRect();
  const r  = el.getBoundingClientRect();

  drag = { el, offX: e.clientX - r.left, offY: e.clientY - r.top };

  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');

  speakName(el._animal.name);        // ★ 英语发音

  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
}

/* ---- 拖动中 ---- */
function onPointerMove(e) {
  if (!drag) return;
  const gr = game.getBoundingClientRect();
  drag.el.style.left = (e.clientX - gr.left - drag.offX) + 'px';
  drag.el.style.top  = (e.clientY - gr.top  - drag.offY) + 'px';

  const hit = hitBin(e.clientX, e.clientY);
  document.querySelectorAll('.bin').forEach(b => b.classList.toggle('hot', b === hit));
}

/* ---- 松开 ---- */
function onPointerUp(e) {
  if (!drag) return;

  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerUp);
  document.querySelectorAll('.bin').forEach(b => b.classList.remove('hot'));

  const el   = drag.el;
  const home = el._home || { x: 0, y: 0 };
  const bin  = hitBin(e.clientX, e.clientY);

  el.classList.remove('dragging');
  drag = null;

  /* ✅ 放对了 */
  if (bin && bin.dataset.type === el.dataset.type) {
    el.classList.add('placed');
    el.style.pointerEvents = 'none';
    el.style.transition = 'transform .22s ease, opacity .22s ease';
    el.style.transformOrigin = '50% 50%';
    el.style.transform = 'scale(.25) rotate(12deg)';
    el.style.opacity = '0';

    flashScreen('green');       // 绿色氛围灯
    playDing(true);
    speakName(el._animal.name); // 再读一遍，加深记忆

    setTimeout(() => {
      const a = el._animal;
      el.remove();
      addChip(bin, a);
      layout();
    }, 190);

    placed++;
    doneEl.textContent = placed;
    if (placed === ANIMALS.length) setTimeout(showWin, 700);
    return;
  }

  /* ❌ 放错了 / 放回原处 */
  if (bin) {
    flashScreen('red');         // 红色氛围灯
    playDing(false);
    el.classList.add('wrong');
    bin.classList.add('wrong');
    setTimeout(() => {
      el.classList.remove('wrong');
      bin.classList.remove('wrong');
    }, 430);
  }

  el.style.transition = 'left .36s cubic-bezier(.34,1.5,.64,1), top .36s cubic-bezier(.34,1.5,.64,1)';
  el.style.left = home.x + 'px';
  el.style.top  = home.y + 'px';
}

/* ---- 放入分类格 ---- */
function addChip(bin, animal) {
  const slots = bin.querySelector('.slots');
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = animal.svg + `<span>${animal.name}</span>`;
  slots.appendChild(chip);
  requestAnimationFrame(() => chip.classList.add('pop'));
}

/* ---- 通关 ---- */
function showWin() {
  winEl.classList.add('show');
  flashScreen('green');
  playDing(true);
  speakName('Great job');
}

/* ---- 重开 & 自适应 ---- */
document.getElementById('reset').addEventListener('click', buildGame);
document.getElementById('playAgain').addEventListener('click', buildGame);

let rzTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(layout, 120);
});

/* 启动 */
buildGame();
</script>
